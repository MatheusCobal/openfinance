[project]
name = "openfinance"
version = "0.1.0"
dependencies = [
    "alembic",
    "fastapi[standard]",
    # 0.0.47 changed plain ``datetime`` fields to require timezone-aware
    # values, while this app and its existing SQLite data use naive UTC.
    "sqlmodel==0.0.34",
    "httpx",
    "pydantic-settings",
    "argon2-cffi",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff==0.15.16",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
